<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <title>Galeria</title>
  <link rel="stylesheet" href="../Csss/galeria.css">
</head>
<body>
 
<div class="phone">
 
  <div class="gallery-header">
    <div class="back-btn" id="btn-back">‹ Câmera</div>
    <div class="gallery-title">Galeria</div>
    <div class="tabs-row">
      <span class="tab active" onclick="switchTab(this)">todos</span>
      <span class="tab" onclick="switchTab(this)">Fotos</span>
      <span class="tab" onclick="switchTab(this)">Vídeos</span>
    </div>
  </div>
 
  <div class="gallery-grid">
    <div class="photo-cell"></div>
    <div class="photo-cell"></div>
    <div class="photo-cell"></div>
    <div class="photo-cell"></div>
    <div class="photo-cell"></div>
    <div class="photo-cell"></div>
    <div class="photo-cell"></div>
    <div class="photo-cell"></div>
    <div class="photo-cell"></div>
  </div>
 
  <div class="bottom-bar">
    <div class="bottom-icon" id="btn-camera">📷</div>
    <span class="photos-count">9 fotos</span>
    <div class="bottom-icon" id="btn-settings">⚙️</div>
  </div>
 
</div>

<script>
  function switchTab(el) {
    document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
    el.classList.add('active');
  }
 
  document.getElementById('btn-back').addEventListener('click', function() {
    window.location.href = 'camera.html';
  });
 
  document.getElementById('btn-camera').addEventListener('click', function() {
    window.location.href = 'camera.html';
  });
 
  document.getElementById('btn-settings').addEventListener('click', function() {
    window.location.href = 'config.html';
  });
</script>
 
</body>

</html>
